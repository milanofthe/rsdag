[package]
name = "rsdag-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python tracer and bindings for rsdag: trace, jit, jacobian, grad"
publish = false

[lib]
name = "_rsdag"
crate-type = ["cdylib"]

[dependencies]
rsdag.workspace = true
rsdag-jit = { path = "../rsdag-jit" }
rsdag-c = { path = "../rsdag-c" }
# `extension-module` is added by maturin (pyproject.toml); a plain cargo build
# links libpython so the workspace builds and tests as a whole.
pyo3 = { version = "0.22", features = ["abi3-py39"] }

[lints]
workspace = true
