[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rsdag"
version = "0.1.0"
description = "Rust symbolic graph backend: trace Python functions into a graph, differentiate, compile"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
license-files = ["LICENSE"]

[tool.maturin]
python-source = "python"
module-name = "rsdag._rsdag"
features = ["pyo3/extension-module"]
