name: ci
on:
  pull_request:
  workflow_dispatch:
jobs:
  rust:
    name: Lint and test on Linux only, the full gate is scripts/ci.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude rsdag-py --all-targets --features 'rsdag/synth rsdag/serde' -- -D warnings
      - name: Test with rsprobe recording, so that the tests that read rsdag's measures check them
        run: cargo test --workspace --exclude rsdag-py --features 'rsdag/synth rsdag/serde rsprobe/on'
