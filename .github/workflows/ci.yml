name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # rsdag-py links libpython; it is built and tested by the python job.
      - run: cargo clippy --workspace --exclude rsdag-py --all-targets --features rsdag/synth -- -D warnings
      - run: cargo test --workspace --exclude rsdag-py --features rsdag/synth
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin numpy pytest
      - run: maturin build --release -m crates/rsdag-py/Cargo.toml -o dist
      - run: pip install dist/*.whl
      - run: python -m pytest -q crates/rsdag-py/tests
