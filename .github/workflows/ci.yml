name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # rsdag-py links libpython; it is built and tested by the python job.
      - run: cargo clippy --workspace --exclude rsdag-py --all-targets --features 'rsdag/synth rsdag/serde' -- -D warnings
      - run: cargo test --workspace --exclude rsdag-py --features 'rsdag/synth rsdag/serde'
      # The optional features must also build and lint on their own, so a
      # consumer that takes neither of them still compiles.
      - run: cargo clippy -p rsdag --all-targets -- -D warnings
      # A dangling doc link is a stale doc: fail on it.
      - run: cargo doc --no-deps --workspace --exclude rsdag-py --features 'rsdag/synth rsdag/serde'
        env:
          RUSTDOCFLAGS: -D warnings
      # The graph crate in the browser: a consumer's web build interprets there.
      - run: cargo check -p rsdag --features serde --target wasm32-unknown-unknown
  # The native backend on the two conventions this runner does not cover:
  # Windows x64 here, AArch64 on macOS.
  native:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rsdag-jit --all-targets --features rsdag/synth -- -D warnings
      - run: cargo test -p rsdag-jit --features rsdag/synth
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin numpy pytest
      - run: maturin build --release -m crates/rsdag-py/Cargo.toml -o dist
      - run: pip install dist/*.whl
      - run: python -m pytest -q crates/rsdag-py/tests
