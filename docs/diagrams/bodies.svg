<svg xmlns="http://www.w3.org/2000/svg" width="770" height="320" viewBox="0 0 770 320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="bd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b8b"/>
    </marker>
  </defs>

  <!-- Call sites -->
  <rect x="24" y="30" width="150" height="44" rx="4" fill="none" stroke="#8b8b8b" stroke-width="1.2"/>
  <text x="99" y="48" text-anchor="middle" font-weight="bold" fill="#8b8b8b">instance 1</text>
  <text x="99" y="64" text-anchor="middle" fill="#8b8b8b">args x1, p1</text>

  <rect x="24" y="90" width="150" height="44" rx="4" fill="none" stroke="#8b8b8b" stroke-width="1.2"/>
  <text x="99" y="108" text-anchor="middle" font-weight="bold" fill="#8b8b8b">instance 2</text>
  <text x="99" y="124" text-anchor="middle" fill="#8b8b8b">args x2, p2</text>

  <text x="99" y="172" text-anchor="middle" font-size="14" fill="#8b8b8b">...</text>

  <rect x="24" y="196" width="150" height="44" rx="4" fill="none" stroke="#8b8b8b" stroke-width="1.2"/>
  <text x="99" y="214" text-anchor="middle" font-weight="bold" fill="#8b8b8b">instance N</text>
  <text x="99" y="230" text-anchor="middle" fill="#8b8b8b">args xN, pN</text>

  <!-- call_batch -->
  <rect x="240" y="80" width="170" height="120" rx="4" fill="none" stroke="#8b8b8b" stroke-width="1.2"/>
  <text x="325" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b8b8b">call_batch</text>
  <text x="325" y="130" text-anchor="middle" fill="#8b8b8b">
    <tspan x="325" y="130">one kernel op,</tspan>
    <tspan x="325" y="147">all instances,</tspan>
    <tspan x="325" y="164">rayon batching</tspan>
    <tspan x="325" y="181">when worth a fork</tspan>
  </text>

  <!-- Body -->
  <rect x="540" y="80" width="200" height="120" rx="4" fill="none" stroke="#8b8b8b" stroke-width="1.2"/>
  <text x="640" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b8b8b">body: compiled once</text>
  <text x="640" y="130" text-anchor="middle" fill="#8b8b8b">
    <tspan x="640" y="130">one tape,</tspan>
    <tspan x="640" y="147">emitted once,</tspan>
    <tspan x="640" y="164">called per instance</tspan>
  </text>

  <!-- Arrows -->
  <g stroke="#8b8b8b" stroke-width="1.2" fill="none" marker-end="url(#bd-arrow)">
    <line x1="174" y1="52" x2="240" y2="120"/>
    <line x1="174" y1="112" x2="240" y2="135"/>
    <line x1="174" y1="218" x2="240" y2="160"/>
    <line x1="410" y1="150" x2="540" y2="150"/>
  </g>
  <text x="475" y="122" text-anchor="middle" fill="#8b8b8b">runs the body</text>
  <text x="475" y="138" text-anchor="middle" fill="#8b8b8b">over all instances</text>

  <!-- Prolog cache note -->
  <line x1="640" y1="200" x2="640" y2="232" stroke="#c55a11" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="540" y="232" width="200" height="68" rx="4" fill="none" stroke="#c55a11" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="640" y="256" text-anchor="middle" fill="#8b8b8b">
    <tspan x="640" y="256">prolog cached per instance</tspan>
    <tspan x="640" y="273">over its parameter-pure</tspan>
    <tspan x="640" y="290">arguments</tspan>
  </text>
</svg>
